<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premios de Hito - Álbum Digital</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="premio-hito.css">
</head>
<body class="flex flex-col min-h-screen">

  <!-- CABECERA -->
  <header class="sticky top-0 z-40 metal-card rounded-none px-6 py-4 flex justify-between items-center">
    <div class="flex items-center space-x-3 cursor-pointer select-none" onclick="window.location.href='album.html'">
      <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-blue-500 to-purple-600 flex items-center justify-center font-bold text-xl shadow-lg border border-white/20">Á</div>
      <div>
        <h1 class="text-lg font-bold glow-text leading-none">ÁLBUM DIGITAL</h1>
        <span class="text-xs text-purple-300">Gestión de Premios e Hitos</span>
      </div>
    </div>
    <nav class="flex space-x-2">
  <a href="album.html" class="px-4 py-2 rounded-lg text-sm font-semibold bg-slate-800 text-slate-300 hover:bg-purple-600/30">Álbum</a>
  <a href="tienda.html" class="px-4 py-2 rounded-lg text-sm font-semibold bg-slate-800 text-slate-300 hover:bg-purple-600/30">Tienda</a>
  <a href="premio-hito.html" class="px-4 py-2 rounded-lg text-sm font-semibold bg-amber-600/40 text-amber-200 border border-amber-500/30">Premios</a>
  <button onclick="logoutUser()" class="px-3 py-2 rounded-lg text-sm font-semibold bg-red-900/40 text-red-200">Salir</button>
</nav>
  </header>

  <!-- CONTENIDO PRINCIPAL DE PREMIOS -->
  <main class="flex-grow flex items-center justify-center p-4">
    <section class="max-w-xl w-full">
      <div class="metal-card p-6 md:p-8 space-y-6 border border-amber-500/40">
        
        <div class="border-b border-amber-500/30 pb-4 flex justify-between items-center">
          <div>
            <h2 class="text-2xl font-bold text-amber-400">PREMIOS DE HITO Y CICLO ($200)</h2>
            <p class="text-xs text-purple-200/80">Reclama tus recompensas al alcanzar las metas del álbum.</p>
          </div>
          <div class="text-right">
            <span class="text-xs text-slate-400">Saldo Disponible:</span>
            <p id="userBalanceDisplay" class="text-sm font-bold text-emerald-400">Bs. 0.00</p>
          </div>
        </div>

        <div class="space-y-4">
          <p class="text-xs text-purple-300">Selecciona el hito desbloqueado que deseas reclamar:</p>
          <div id="milestoneOptions" class="grid grid-cols-2 gap-3 text-xs"></div>
        </div>

        <form onsubmit="submitWithdrawalRequest(event)" class="space-y-3 pt-2">
          <div>
            <label class="block text-xs font-semibold text-purple-200 mb-1">Banco para Pago Móvil:</label>
            <input type="text" id="wBank" required placeholder="Ej: 0134 (Banesco)" class="w-full bg-slate-900 border border-purple-500/40 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-purple-200 mb-1">Teléfono:</label>
            <input type="text" id="wPhone" required placeholder="Ej: 04121234567" class="w-full bg-slate-900 border border-purple-500/40 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-purple-200 mb-1">Cédula de Identidad:</label>
            <input type="text" id="wId" required placeholder="Ej: 21101658" class="w-full bg-slate-900 border border-purple-500/40 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none">
          </div>
          <button type="submit" id="btnSendWithdraw" class="w-full py-3.5 bg-gradient-to-r from-amber-500 to-emerald-600 text-white font-bold rounded-xl text-sm transition disabled:opacity-50 mt-2" disabled>RECLAMAR PREMIO HITO</button>
        </form>

        <div class="pt-4 border-t border-slate-800 text-center">
          <button onclick="confirmTotalLiquidate()" id="btnTotalLiquidate" class="px-4 py-2 rounded-xl bg-red-600/30 hover:bg-red-600/50 text-red-300 font-bold text-xs border border-red-500/40 transition disabled:opacity-50">
            Solicitar Liquidación Total del Saldo Neto
          </button>
        </div>

      </div>
    </section>
  </main>

  <script src="premio-hito.js"></script>
</body>
</html>
