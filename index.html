<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALBUM DIGITAL</title>
  <link rel="icon" type="image/jpeg" href="logo-album.jpg">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="login.css">
</head>
<body class="flex items-center justify-center min-h-screen p-4 bg-slate-950">

  <!-- ========================================== -->
  <!-- PANTALLA DE BIENVENIDA / INTRO CINEMÁTICA -->
  <!-- ========================================== -->
  <div id="introOverlay">
    <video id="introVideo" playsinline>
      <source src="logo-animado.mp4" type="video/mp4">
      </video>
    <div class="absolute inset-0 bg-gradient-to-t from-black via-slate-950/80 to-black z-10 opacity-70"></div>
    <div class="intro-content z-20 space-y-6">
      <div id="playContainer">
        <button onclick="startIntroExperience()" class="metal-button px-8 py-4 rounded-2xl font-extrabold text-white text-base shadow-2xl flex items-center gap-3 mx-auto border border-purple-500/50 hover:scale-105 transition-transform">
          <i data-lucide="play-circle" class="w-6 h-6 text-amber-400"></i>
          COMENZAR EXPERIENCIA
        </button>
    </div>

      <div id="rulesBox" class="hidden metal-card p-6 border border-purple-500/50 rounded-2xl bg-slate-900/90 backdrop-blur-md shadow-2xl space-y-4">
        <h3 class="text-lg font-extrabold text-amber-400 glow-text">📜 REGLAS DEL ÁLBUM DIGITAL</h3>
        <p id="typedRulesText" class="text-xs text-purple-100 leading-relaxed min-h-[80px] font-mono text-left"></p>
        <button onclick="revealLoginScreen()" class="metal-button w-full py-3 rounded-xl font-bold text-white text-xs mt-2 shadow-lg hover:scale-[1.02] transition-transform">
          INICIAR
        </button>
      </div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- CONTENIDO PRINCIPAL (LOGIN / REGISTRO)     -->
  <!-- ========================================== -->
  <video autoplay muted loop playsinline class="bg-smoke-video">
    <source src="smoke.mp4" type="video/mp4">
  </video>
  
  <main class="max-w-md w-full p-8 metal-card space-y-6">
    <div class="text-center space-y-2">
      <div class="w-20 h-20 mx-auto rounded-2xl overflow-hidden shadow-xl border-2 border-purple-500/80 bg-slate-900 group transition hover:scale-105">
        <video autoplay muted loop playsinline class="w-full h-full object-cover">
          <source src="logo-animado.mp4" type="video/mp4">
        </video>
      </div>
      <h2 class="text-2xl font-extrabold glow-text" id="authTitle">INICIO</h2>
      <p class="text-xs text-purple-200/80">Entra, Completa y ¡GANA! Acumulando barajitas con ciclo infinito.</p>
    </div>

    <!-- Formulario de Inicio de Sesión -->
    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-purple-200 mb-1">Usuario / Username:</label>
        <input type="text" id="loginUsername" required class="w-full bg-slate-900 border border-purple-500/40 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none">
      </div>
      <div>
        <label class="block text-xs font-semibold text-purple-200 mb-1">Contraseña:</label>
        <div class="relative w-full">
          <input 
            type="password" 
            id="loginPassword"
            autocomplete="current-password"
            placeholder="Máx. 12 caracteres" 
            maxlength="12"
            class="w-full bg-slate-100 border border-purple-500/50 rounded-xl px-4 py-2.5 pr-11 text-slate-900 placeholder-slate-400 focus:outline-none focus:border-purple-600 text-sm font-medium"
          />
          <button 
            type="button" 
            onclick="togglePassword('loginPassword', 'eyeIconLogin')" 
            class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-600 hover:text-purple-700 transition-colors z-10"
          >
            <i data-lucide="eye" id="eyeIconLogin" class="w-5 h-5"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="metal-button w-full py-3 rounded-xl font-bold text-white text-sm">INICIAR SESIÓN</button>
      <div class="flex justify-between text-xs text-purple-300 pt-2">
        <button type="button" onclick="switchAuthMode('register')" class="hover:underline">¿No tienes cuenta? Regístrate</button>
        <button type="button" onclick="openRecoveryModal()" class="hover:underline text-amber-400">¿Olvidaste tu contraseña?</button>
      </div>
    </form>

    <!-- Formulario de Registro -->
    <form id="registerForm" onsubmit="handleRegister(event)" class="hidden space-y-3">
      <div>
        <label class="block text-xs font-semibold text-purple-200 mb-1">Usuario (Username):</label>
        <input type="text" id="regUsername" required class="w-full bg-slate-900 border border-purple-500/40 rounded-lg p-2 text-white text-xs">
        <input type="text" id="regCodigoReferido" placeholder="Código de referido" class="w-full bg-slate-900 border border-purple-500/40 rounded-xl px-4 py-3 text-white focus:outline-none text-sm mt-2">
        <p id="regErrorMsg" class="text-red-400 text-[11px] mt-1 font-medium min-h-[16px]"></p>
      </div>
      <div>
        <label class="block text-xs font-semibold text-purple-200 mb-1">Correo Electrónico (Gmail):</label>
        <input type="email" id="regEmail" required class="w-full bg-slate-900 border border-purple-500/40 rounded-lg p-2 text-white text-xs">
      </div>
      <div>
        <label class="block text-xs font-semibold text-purple-200 mb-1">Contraseña:</label>
        <div class="relative w-full">
          <input 
            type="password" 
            id="passwordRegister"
            autocomplete="current-password"
            placeholder="Crea tu contraseña (máx 12)" 
            maxlength="12"
            class="w-full bg-slate-100 border border-purple-500/50 rounded-xl px-4 py-2.5 pr-11 text-slate-900 placeholder-slate-400 focus:outline-none focus:border-purple-600 text-sm font-medium"
          />
          <button 
            type="button" 
            onclick="togglePassword('passwordRegister', 'eyeIconRegister')" 
            class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-600 hover:text-purple-700 transition-colors z-10"
          >
            <i data-lucide="eye" id="eyeIconRegister" class="w-5 h-5"></i>
          </button>
        </div>
      </div>
      <div class="grid grid-cols-3 gap-2">
        <div><label class="block text-[10px] text-purple-200">Banco:</label><input type="text" id="regBanco" required placeholder="0134" class="w-full bg-slate-900 border border-purple-500/40 rounded-lg p-2 text-white text-xs"></div>
        <div><label class="block text-[10px] text-purple-200">Cédula:</label><input type="text" id="regCedula" required placeholder="V-********" class="w-full bg-slate-900 border border-purple-500/40 rounded-lg p-2 text-white text-xs"></div>
        <div><label class="block text-[10px] text-purple-200">Teléfono:</label><input type="text" id="regTelefono" required placeholder="0412..." class="w-full bg-slate-900 border border-purple-500/40 rounded-lg p-2 text-white text-xs"></div>
      </div>

      <div class="flex items-center space-x-2 pt-1">
        <input type="checkbox" id="regTerms" required class="rounded border-purple-500/40 bg-slate-900 text-purple-600 focus:ring-0">
        <label for="regTerms" class="text-[11px] text-purple-200">
          Acepto los <button type="button" onclick="openTermsModal()" class="text-amber-400 underline font-semibold hover:text-amber-300">Términos y Condiciones</button>
        </label>
      </div>

      <div class="flex items-center space-x-2">
        <input type="checkbox" id="regPrivacy" required class="rounded border-purple-500/40 bg-slate-900 text-purple-600 focus:ring-0">
        <label for="regPrivacy" class="text-[11px] text-purple-200">
          Acepto la <button type="button" onclick="openPrivacyModal()" class="text-amber-400 underline font-semibold hover:text-amber-300">Política de Privacidad</button>
        </label>
      </div>

      <button type="submit" class="metal-button w-full py-3 rounded-xl font-bold text-white text-sm mt-2">REGISTRARSE</button>
      <button type="button" onclick="switchAuthMode('login')" class="w-full text-center text-xs text-purple-300 hover:underline pt-2">¿Ya tienes cuenta? Inicia sesión</button>
    </form>
  </main>

  <!-- MODALES -->
  <div id="recoveryModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4"></div>
  <div id="termsModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4"></div>
  <div id="privacyModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4"></div>

  <!-- SCRIPT DE CONTROL DE INTRO -->
  <script>
    lucide.createIcons();

    const rulesTextContent = "• Colecciona las 1,000 barajitas digitales de forma inteligente.\n• Alcanza las metas de hitos en 250, 500, 750 y 1,000 barajitas.\n• Obtén ganancias reales pagadas directamente por Pago Móvil.\n• Completa el ciclo y actívalo de nuevo de forma infinita.";

    function startIntroExperience() {
      const btnContainer = document.getElementById('playContainer');
      const video = document.getElementById('introVideo');
      
      btnContainer.classList.add('fade-out');
      setTimeout(() => btnContainer.style.display = 'none', 500);

      video.muted = false;
      video.play();

      // Control para desvanecer el video 1.5 segundos antes de que termine
      video.ontimeupdate = () => {
        if (video.duration && (video.duration - video.currentTime <= 1.5)) {
          video.style.opacity = '0'; // Empieza a difuminarse suavemente
          video.ontimeupdate = null; // Evita que se ejecute repetidamente
        }
      };

      // Cuando termina por completo, muestra las reglas
      video.onended = () => {
        showRulesWithTypingEffect();
      };
    }

    function showRulesWithTypingEffect() {
      const rulesBox = document.getElementById('rulesBox');
      rulesBox.classList.add('active');
      rulesBox.classList.remove('hidden');

      const textContainer = document.getElementById('typedRulesText');
      textContainer.innerHTML = "";
      let index = 0;

      function typeWriter() {
        if (index < rulesTextContent.length) {
          textContainer.innerHTML += rulesTextContent.charAt(index) === '\n' ? '<br>' : rulesTextContent.charAt(index);
          index++;
          setTimeout(typeWriter, 25);
        }
      }
      typeWriter();
    }

    function revealLoginScreen() {
      const overlay = document.getElementById('introOverlay');
      overlay.classList.add('fade-out');
      setTimeout(() => overlay.remove(), 1500);
    }
  </script>
  <script src="login.js"></script>
</body>
</html>
