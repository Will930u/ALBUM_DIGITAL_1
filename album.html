<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ÁLBUM DIGITAL</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="album.css">
</head>
<body class="flex flex-col min-h-screen relative overflow-x-hidden">

  <!-- ==========================================
       HUMO LATERAL DE FONDO CON VIDEO (smoke.mp4)
       ========================================== -->
  <video autoplay muted loop playsinline class="side-smoke left-smoke">
    <source src="smoke.mp4" type="video/mp4">
  </video>
  <video autoplay muted loop playsinline class="side-smoke right-smoke">
    <source src="smoke.mp4" type="video/mp4">
  </video>

  <!-- CABECERA DE NAVEGACIÓN ADAPTABLE (PC, TABLET Y MÓVIL) -->
  <header class="sticky top-0 z-40 metal-card rounded-none px-4 md:px-6 py-3 flex flex-col lg:flex-row justify-between items-center gap-4">
    
    <!-- Fila Superior / Logo y Título -->
    <div class="flex w-full lg:w-auto justify-between items-center">
      <div class="flex items-center space-x-3 cursor-pointer select-none" id="appLogo">
        <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-blue-500 to-purple-600 flex items-center justify-center font-bold text-xl shadow-lg border border-white/20">Á</div>
        <div>
          <h1 class="text-base md:text-lg font-bold glow-text leading-none">ÁLBUM DIGITAL</h1>
          <span class="text-xs text-purple-300">2000 Barajitas Coleccionables</span>
        </div>
      </div>
    </div>
    
    <!-- Controles Centrales y Acciones Financieras -->
    <div class="flex flex-wrap items-center justify-center lg:justify-end gap-2.5 w-full lg:w-auto">
      
      <!-- Botón Premio Hito -->
      <button id="btnHeaderMilestone" onclick="openWithdrawModal()" class="px-3 py-1.5 rounded-full bg-gradient-to-r from-amber-500 to-emerald-600 text-white font-bold text-xs flex items-center space-x-1.5 shadow-lg transition disabled:opacity-50">
        <i data-lucide="award" class="w-4 h-4"></i>
        <span>Premio Hito ($200)</span>
      </button>

      <!-- Saldo Neto y Liquidación -->
      <div class="bg-slate-900/80 border border-purple-500/40 px-3 py-1.5 rounded-full flex items-center space-x-2">
        <i data-lucide="wallet" class="w-4 h-4 text-purple-400 hidden sm:inline-block"></i>
        <span class="text-xs text-slate-400">Valor Neto:</span>
        <span id="userBalanceBs" class="font-bold text-emerald-400 text-xs md:text-sm">Bs. 0.00 ($0.00)</span>
        <button id="btnHeaderTotalLiquidate" onclick="confirmTotalLiquidate()" class="ml-1 px-2 py-0.5 rounded-full bg-red-600 hover:bg-red-500 text-white font-extrabold text-[10px] uppercase transition disabled:opacity-50">
          Liquidar
        </button>
      </div>

    </div>

    <!-- Menú de Enlaces a otros Módulos (Adaptable horizontalmente) -->
    <nav class="flex flex-wrap items-center justify-center gap-2 w-full lg:w-auto pt-2 lg:pt-0 border-t lg:border-t-0 border-purple-500/20">
      <a href="album.html" class="px-3 py-1.5 rounded-lg text-xs md:text-sm font-semibold bg-purple-600/30 text-purple-200 border border-purple-500/30">Álbum</a>
      <a href="tienda.html" class="px-3 py-1.5 rounded-lg text-xs md:text-sm font-semibold bg-slate-800 text-slate-300 hover:bg-purple-600/30">Tienda</a>
      <button onclick="logoutUser()" class="px-3 py-1.5 rounded-lg text-xs md:text-sm font-semibold bg-red-900/40 text-red-200">Salir</button>
    </nav>

  </header>

  <!-- CONTENEDOR DE NOTIFICACIONES FLOTANTES EN TIEMPO REAL -->
  <div class="w-full max-w-6xl mx-auto px-4 mt-4 relative z-20">
    <div id="userNotificationsContainer" class="w-full space-y-2"></div>
  </div>

  <!-- CONTENIDO PRINCIPAL DEL ÁLBUM -->
  <main class="flex-grow flex flex-col items-center justify-center p-4 w-full max-w-6xl mx-auto space-y-6 relative z-20">
    
    <!-- Barra de Paginación y Progreso -->
    <div class="metal-card p-4 w-full flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center space-x-4">
        <button onclick="changePage(-1)" class="p-2 rounded-lg bg-slate-800 border border-purple-500/30 text-white hover:bg-slate-700 transition"><i data-lucide="chevron-left" class="w-6 h-6"></i></button>
        <span class="text-lg font-bold text-purple-200">Página <span id="currentPageNum" class="text-blue-400">1</span> de 80</span>
        <button onclick="changePage(1)" class="p-2 rounded-lg bg-slate-800 border border-purple-500/30 text-white hover:bg-slate-700 transition"><i data-lucide="chevron-right" class="w-6 h-6"></i></button>
      </div>
      
      <div class="w-full md:w-1/3 space-y-1">
        <div class="flex justify-between text-xs text-purple-300 font-semibold">
          <span>Progreso Global</span>
          <span id="albumProgressText">0 / 2000 (0%)</span>
        </div>
        <div class="w-full bg-slate-900 rounded-full h-3 overflow-hidden border border-purple-500/30">
          <div id="albumProgressBar" class="bg-gradient-to-r from-blue-500 to-purple-600 h-full w-0 transition-all duration-500"></div>
        </div>
      </div>
    </div>

    <!-- Cuadrícula Dinámica de Barajitas -->
    <div id="stickersGrid" class="grid grid-cols-4 sm:grid-cols-5 md:grid-cols-5 lg:grid-cols-5 gap-6 p-4 w-full justify-items-center"></div>

  </main>

  <!-- MODAL DE PREMIOS DE HITO / CICLO -->
  <div id="withdrawModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="metal-card max-w-lg w-full p-6 space-y-5 border border-amber-500/50 relative z-20">
      <div class="flex justify-between items-center border-b border-amber-500/30 pb-3">
        <h3 class="text-xl font-bold text-amber-400">Premios de Hito / Ciclo ($200)</h3>
        <button onclick="closeWithdrawModal()" class="text-slate-400 font-bold hover:text-white">✕</button>
      </div>
      <div id="milestoneOptions" class="grid grid-cols-2 gap-2 text-xs"></div>
      <form onsubmit="submitWithdrawalRequest(event)" class="space-y-3 pt-2">
        <input type="text" id="wBank" required placeholder="Banco (Ej: 0134)" class="w-full bg-slate-900 border border-purple-500/40 rounded-lg p-2.5 text-xs text-white focus:outline-none">
        <input type="text" id="wPhone" required placeholder="Teléfono (Ej: 04121234567)" class="w-full bg-slate-900 border border-purple-500/40 rounded-lg p-2.5 text-xs text-white focus:outline-none">
        <input type="text" id="wId" required placeholder="Cédula" class="w-full bg-slate-900 border border-purple-500/40 rounded-lg p-2.5 text-xs text-white focus:outline-none">
        <button type="submit" id="btnSendWithdraw" class="w-full py-3 bg-gradient-to-r from-amber-500 to-emerald-600 text-white font-bold rounded-xl text-sm transition disabled:opacity-50" disabled>RECLAMAR PREMIO HITO</button>
      </form>
    </div>
  </div>

  <script src="album.js"></script>
</body>
</html>
